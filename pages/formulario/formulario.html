            Formularios </h1>

    <nav>
        <ul style="font-family: Arial, Helvetica, sans-serif;">

    <main>
        <section id="formulario-InputTex">
            <form method="get" action="formulario.html"></form>
            <fieldset style="border: 2px solid;">
                <legend><b> Formulario Input Text </b></legend><br>
                <label for="nombre"> Nombres: </label>
                <input type="text" name="nombre" id="nombre" placeholder="Ingrese sus nombres"><br><br>
                <label for="apellido"> Apellidos: </label>
                <input type="text" name="apellido" id="apellido" placeholder="Ingrese sus apellidos "><br><br>
                <label for="curso"> Curso que quiere buscar: </label>
                <input type="text" name="curso" id="curso" placeholder="Ingrese el curso a buscar"><br><br>
                <button type="submit"> BUSCAR </button>
                <button type="reset"> LIMPIAR </button>
            </fieldset><br>
            </form>
        </section>

        <section id="formulario-Select">
            <form method="get" action="formulario.html">
                <fieldset style="border: 2px solid;">
                    <legend> <b> Formulario Select </b></legend><br>

                    <label form="categoria"> Categoria del curso: </label>
                    <select name="categoria" id="categoria">
                        <option value="Fundamentos"> Fundamentos de Sistema Web </option>
                        <option value="programacion"> Programación </option>
                        <option value="diseño"> Diseño </option>
                        <option value="Base de Datos"> Base de datos </option>
                        <option value="Redes"> Redes  </option>
                    </select> <br><br>

                    <label for="horario"> Horario Disponible: </label>
                    <select name="horario" id="horario">
                        <option value="mañana"> Mañana </option>
                        <option value="tarde"> Tarde </option>
                        <option value="noche"> Noche </option>
                    </select><br><br>

                    <label for="modalidad"> Modalidad:  </label>

                </fieldset> 
            </form>

        </section>

    </main>
    <footer>
        <p
            style="background-color: rgb(184, 230, 216); text-align: center; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">

        </p>
    </footer>
</body>

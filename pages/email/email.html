        </ul>

    <main>

        <section id="email">
            <form method="get" action="../formulario/formulario.html">
                <fieldset style="border: 2px solid;">
                    <legend style="color: rgb(35, 114, 13); font-size: 27px ;"><b> Formulario de Contacto </b></legend>
                    <br>
                    <label for="nombres"> Nombres: </label>
                    <input type="text" name="nombres" id="nombres" placeholder="Ingrese sus nombres" required><br><br>
                    <label for="apellidos"> Apellidos: </label>
                    <input type="text" name="apellidos" id="apellidos" placeholder="Ingrese sus apellidos"
                        required><br><br>
                    <label for="email"> Correo electrónico: </label>
                    <input type="email" name="email" id="email" placeholder="Ingrese su correo electrónico"
                        required><br><br>
                    <label for="cedula">Cedula: </label>
                    <input type="text" name="cedula" id="cedula" placeholder="Ingrese su número de cédula"
                        minlength="10" maxlength="10" required><br><br>
                    <label for="mensaje"> Como se entero del curso: </label><br>
                    <input type="radio" name="mensaje" id="mensaje" value="TikTok"> TikTok <br>
                    <input type="radio" name="mensaje" id="mensaje" value="Instagram"> Instagram <br>
                    <input type="radio" name="mensaje" id="mensaje" value="Facebook"> Facebook <br>
                    <input type="radio" name="mensaje" id="mensaje" value="Twitter"> Twitter <br>
                    <input type="radio" name="mensaje" id="mensaje" value="Otro"> Otro <input type="text"> <br><br>
                    <button type="submit"> ENVIAR </button>
                    <button type="reset"> LIMPIAR </button>

                </fieldset>
            </form>

        </section>
    </main>
    <footer>
